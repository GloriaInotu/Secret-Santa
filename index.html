<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="index.js"></script>
        <link rel="stylesheet" href="./style.css">
        <script src="../index.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Epunda+Slab:ital,wght@0,300..900;1,300..900&family=Petit+Formal+Script&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="header">
            <h1>Secret Santa</h1>
            <h2>Welcome girlies, please enter your name and your gift list </h2>
        </div>

        <div id="content"> 
            
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Please enter your name" required> <br>
                <h3>Below, write your desired gifts seperated with commas </h3>
                <label for="giftlist">Gift List:</label>
                <input type="text" id="giftlist" name="giftlist" size="80" required> <br>
                <br />
                <input type="submit" id="submit" value="Submit">
            </form>
        </div>

        <div id="audio-container">
            <audio controls autoplay loop>
            <source src="ariana-grande-december.mp3" type="audio/mpeg">
        </audio>
        </div>
        
        
    </body>
</html>
