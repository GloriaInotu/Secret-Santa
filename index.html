<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style.css">
        <script src="../index.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clicker+Script&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="header">
            <h1>Secret Santa</h1>
            <h3>Welcome girlies, please enter your name and your gift list </h3>
        </div>

        <div id="content"> 
            
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Please enter your name" required> <br>
                <h4>Below, write your desired gifts seperated with commas </h4>
                <label for="giftlist">Gift List:</label>
                <input type="text" id="giftlist" name="giftlist" size="80" required> <br>
                <br />
                <input type="submit" id="submit" value="Submit">
            </form>
        </div>
        
    </body>
</html>
